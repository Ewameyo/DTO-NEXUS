<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT-77 | INDUSTRIAL TELEMETRY</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; filter: opacity(0.15); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; position: relative; }
        .panel { border: 1px solid #00ffcc; padding: 20px; background: rgba(0, 50, 50, 0.2); box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); backdrop-filter: blur(5px); }
        .header { border-bottom: 2px solid #00ffcc; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat { font-size: 2.2rem; color: #fff; font-weight: bold; }
        .label { font-size: 0.8rem; text-transform: uppercase; color: #00ffcc; letter-spacing: 2px; }
        #sys-clock { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="header">
        <h1>NEXUS COMMAND: VAULT-77</h1>
        <div id="sys-clock">00:00:00 EAT</div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="label">OEE Efficiency Node</div>
            <div class="stat" id="oee-val">LOADING...</div>
            <div class="label" style="font-size: 0.6rem; margin-top: 10px; color: #666;">Target: World Class 85%+</div>
        </div>

        <div class="panel">
            <div class="label">USD / KES Real-Time</div>
            <div class="stat" id="kes-val">LOADING...</div>
            <div class="label" style="font-size: 0.6rem; margin-top: 10px; color: #666;">Source: Nairobi Central Node</div>
        </div>

        <div class="panel">
            <div class="label">Global BTC/USD</div>
            <div class="stat" id="btc-val">LOADING...</div>
            <div class="label" style="font-size: 0.6rem; margin-top: 10px; color: #666;">Asset Liquidity Status</div>
        </div>
    </div>

    <div class="panel" style="margin-top:20px; height: 450px;">
        <div class="label">Global Manufacturing Analytics (Live Feed)</div>
        <div id="tradingview_chart" style="height: 400px; margin-top: 10px;"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <script type="module">
        import { firebaseConfig } from "./vault77.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statsRef = ref(db, 'nairobi_hq/telemetry');

        onValue(statsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // We use 'oee' instead of pharma now
                document.getElementById('oee-val').innerText = data.oee.toFixed(1) + "%";
                document.getElementById('kes-val').innerText = data.kes.toFixed(4);
                document.getElementById('btc-val').innerText = "$" + data.btc.toLocaleString();
            }
        });

        setInterval(() => {
            document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString() + " EAT";
        }, 1000);

        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "D",
            "timezone": "Africa/Nairobi",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "container_id": "tradingview_chart"
        });
    </script>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "LSSBBΣΩ777WAMEYODTO01";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);
    </script>
</body>
</html>
